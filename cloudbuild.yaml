substitutions:
  _REGION: us-central1
  _BACKEND_SERVICE: vidsavio-api
  _FRONTEND_SERVICE: vidsavio-web
  _FRONTEND_URL: https://vidsavio.com
  _MONGODB_URI_SECRET: MONGODB_URI

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/$_BACKEND_SERVICE:$COMMIT_SHA
      - ./backend

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/$PROJECT_ID/$_BACKEND_SERVICE:$COMMIT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_BACKEND_SERVICE
      - --image
      - gcr.io/$PROJECT_ID/$_BACKEND_SERVICE:$COMMIT_SHA
      - --region
      - $_REGION
      - --platform
      - managed
      - --allow-unauthenticated
      - --set-env-vars
      - NODE_ENV=production,FRONTEND_URL=$_FRONTEND_URL
      - --set-secrets
      - MONGODB_URI=$_MONGODB_URI_SECRET:latest

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run services describe "$_BACKEND_SERVICE" \
          --region "$_REGION" \
          --format 'value(status.url)' > /workspace/backend_url

  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        docker build \
          --build-arg VITE_API_URL="$(cat /workspace/backend_url)/api" \
          -t "gcr.io/$PROJECT_ID/$_FRONTEND_SERVICE:$COMMIT_SHA" \
          ./frontend

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/$PROJECT_ID/$_FRONTEND_SERVICE:$COMMIT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_FRONTEND_SERVICE
      - --image
      - gcr.io/$PROJECT_ID/$_FRONTEND_SERVICE:$COMMIT_SHA
      - --region
      - $_REGION
      - --platform
      - managed
      - --allow-unauthenticated

images:
  - gcr.io/$PROJECT_ID/$_BACKEND_SERVICE:$COMMIT_SHA
  - gcr.io/$PROJECT_ID/$_FRONTEND_SERVICE:$COMMIT_SHA
